name: Build Android APK

on:
  push:
    branches: [ main, master ] # हे तुझ्या मुख्य ब्रांचच्या नावानुसार बदल (सहसा main किंवा master असतं)

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # नवीन आणि स्टेबल व्हर्जन

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor
        run: |
          npx cap init "MyNewApp" com.example.app --web-dir .
          npx cap add android

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
